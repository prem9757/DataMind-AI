<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" />

  <!-- Grid Lines -->
  <line x1="48" y1="196" x2="208" y2="196" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="48" y1="130" x2="208" y2="130" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Metric Columns -->
  <rect x="56" y="130" width="32" height="66" rx="6" fill="url(#bar1Grad)" />
  <rect x="104" y="95" width="32" height="101" rx="6" fill="url(#bar2Grad)" />
  <rect x="152" y="60" width="32" height="136" rx="6" fill="url(#bar3Grad)" />

  <!-- Sparkline Trend -->
  <path d="M 72 130 L 120 95 L 168 60" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="72" cy="130" r="3.5" fill="#38BDF8" />
  <circle cx="120" cy="95" r="3.5" fill="#818CF8" />
  <circle cx="168" cy="60" r="3.5" fill="#F8FAFC" />

  <!-- AI Intelligence Star -->
  <path d="M 200 42 Q 200 52 210 52 Q 200 52 200 62 Q 200 52 190 52 Q 200 52 200 42 Z" fill="#FDE047" filter="url(#glow)" />
</svg>
